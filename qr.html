<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tender Briefing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
body{background:#0b0d12;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;color:#e4e8f0;margin:0;padding:20px;}
.card{background:#13161f;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px 24px;max-width:340px;width:100%;text-align:center;}
.jkr-badge{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#aaff00;margin-bottom:10px;}
h1{font-size:17px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.4;}
.sub{font-size:11px;color:#7a84a0;margin-bottom:18px;line-height:1.5;}
.qr-box{background:#fff;padding:16px;border-radius:10px;display:inline-block;margin-bottom:16px;}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.chip{background:#aaff00;color:#000;font-size:9px;font-weight:700;letter-spacing:.8px;padding:3px 9px;border-radius:4px;}
.chip2{background:rgba(255,255,255,0.08);color:#7a84a0;font-size:9px;font-weight:600;padding:3px 9px;border-radius:4px;border:1px solid rgba(255,255,255,0.08);}
.note{font-size:10px;color:#7a84a0;line-height:1.6;}
.url{font-size:9px;color:#33ccff;margin-top:8px;word-break:break-all;}
</style>
</head>
<body>
<div class="card">
  <div class="jkr-badge" id="qr-badge"></div>
  <h1 id="qr-title"></h1>
  <div class="sub" id="qr-subtitle"></div>
  <div class="qr-box"><img src="qr.png" width="180" height="180" alt="QR Code" id="qr-img"></div>
  <div class="chips" id="qr-chips"></div>
  <div class="note" id="qr-note"></div>
  <div class="url" id="qr-url"></div>
</div>
<script>
document.title = APP_CONFIG.project.title;
document.getElementById('qr-badge').textContent = APP_CONFIG.client.name + ' ' + APP_CONFIG.client.subname;
document.getElementById('qr-title').textContent = APP_CONFIG.qrPage.title;
document.getElementById('qr-subtitle').textContent = APP_CONFIG.qrPage.subtitle;
const chips = document.getElementById('qr-chips');
APP_CONFIG.qrPage.chips.forEach((c, i) => {
  const span = document.createElement('span');
  span.className = i === 0 ? 'chip' : 'chip2';
  span.textContent = c;
  chips.appendChild(span);
});
const tenderChip = document.createElement('span'); tenderChip.className = 'chip2'; tenderChip.textContent = APP_CONFIG.project.tenderNumber; chips.appendChild(tenderChip);
document.getElementById('qr-note').innerHTML = APP_CONFIG.qrPage.note;
document.getElementById('qr-url').textContent = APP_CONFIG.qrPage.url || window.location.href.replace('qr.html', 'mobile.html');
</script>
</body>
</html>
