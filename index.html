<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tender Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>

<style>
:root{
  --bg:#060d18;--panel:#0b1524;--panel2:#0f1d30;--panel3:#14253e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#ddeeff;--muted:#6a88a8;--faint:#1e3a58;
  --yellow:#009B9B;--y2:rgba(0,155,155,0.12);--y3:rgba(0,155,155,0.06);
  --amber:#FFB800;--red:#ff4455;--cyan:#33ccff;--magenta:#ff33cc;--orange:#ff7733;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
/* ── MASTHEAD ── */
#mast{background:var(--panel);border-bottom:2px solid rgba(0,155,155,0.22);
  padding:0 16px;display:flex;align-items:stretch;flex-shrink:0;min-height:68px;z-index:2000;position:relative;}
.m-jkr{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 0;border-right:1px solid var(--border2);flex-shrink:0;}
.m-jkr img.jata{width:52px;height:auto;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));}
.m-jkr-txt .t1{font-size:16px;font-weight:700;color:#fff;letter-spacing:.4px;line-height:1.1;}
.m-jkr-txt .t2{font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:.2px;margin-top:1px;}
.m-jkr-txt .t3{font-size:9px;color:var(--muted);margin-top:2px;}
.m-jkr-txt a{color:var(--muted);text-decoration:none;font-size:9px;}
.m-jkr-txt a:hover{color:var(--yellow);}
.m-centre{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 16px;min-width:0;}
.m-badges{display:flex;gap:5px;align-items:center;margin-bottom:5px;flex-wrap:wrap;}
.chip{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:3px;}
.chip-y{background:var(--yellow);color:#000;}
.chip-n{background:var(--panel3);color:var(--muted);border:1px solid var(--border2);}
.chip-live{background:rgba(0,155,155,0.15);color:#66dddd;border:1px solid rgba(0,155,155,0.3);animation:blink 1.8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.m-title{font-size:13px;font-weight:600;color:#fff;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.m-dates{display:flex;align-items:center;border-left:1px solid var(--border2);flex-shrink:0;}
.di{display:flex;flex-direction:column;align-items:center;padding:6px 11px;
  border-right:1px solid var(--border);min-width:84px;}
.di:last-child{border-right:none;}
.di.active{background:rgba(0,155,155,0.07);}
.di-l{font-size:7.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.di-v{font-size:10.5px;font-weight:700;color:var(--text);text-align:center;line-height:1.3;}
.di.active .di-v{color:var(--yellow);}
.di-n{font-size:7.5px;color:var(--muted);margin-top:2px;}
.m-dpi{display:flex;align-items:center;gap:10px;padding:10px 0 10px 14px;border-left:1px solid var(--border2);flex-shrink:0;}
.m-dpi img{height:32px;width:auto;object-fit:contain;filter:brightness(1.1);}
.m-dpi-txt .d1{font-size:10px;font-weight:700;color:#fff;}
.m-dpi-txt .d2{font-size:8.5px;color:var(--muted);margin-top:1px;}
.m-dpi-txt .d3{font-size:8px;color:var(--muted);margin-top:2px;font-style:italic;}
/* ── TOOLBAR ── */
#tb{background:var(--panel);border-bottom:1px solid var(--border);padding:5px 14px;
  display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.tbb{background:var(--panel2);border:1px solid var(--border2);color:var(--text);
  font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;
  padding:4px 11px;border-radius:5px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tbb:hover{background:var(--panel3);}
.tbb.active{background:var(--yellow);color:#000;border-color:var(--yellow);}
.tsep{width:1px;height:18px;background:var(--border2);margin:0 3px;}
.tlbl{font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.5px;text-transform:uppercase;}
#zdisplay{margin-left:auto;font-size:10px;color:var(--muted);background:var(--panel2);
  padding:3px 9px;border-radius:4px;border:1px solid var(--border);}
/* ── BODY ── */
#body{display:flex;flex:1;overflow:hidden;}
#sidebar{width:310px;min-width:310px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width .3s,min-width .3s;}
#sidebar.collapsed{width:0;min-width:0;}
#map{flex:1;}
/* ── SIDEBAR ── */
.stabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.stab{flex:1;padding:8px 4px;text-align:center;font-size:8.5px;font-weight:600;
  color:var(--muted);cursor:pointer;letter-spacing:.4px;text-transform:uppercase;
  border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.stab.active{color:var(--yellow);border-bottom-color:var(--yellow);}
.tpane{display:none;flex:1;overflow-y:auto;flex-direction:column;}
.tpane.active{display:flex;}
.tb2{padding:10px;display:flex;flex-direction:column;gap:6px;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--faint);border-radius:2px;}
/* Cards/rows */
.slbl{font-size:8.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:3px 0 2px;}
.lrow{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--border);cursor:pointer;transition:border-color .15s;}
.lrow:hover{border-color:var(--border2);}
.ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.lname{font-size:11px;font-weight:500;flex:1;}
.lcnt{font-size:8.5px;color:var(--muted);}
.sw{width:26px;height:15px;background:var(--panel3);border-radius:8px;border:1px solid var(--border2);
  position:relative;transition:all .15s;cursor:pointer;}
.sw::after{content:'';position:absolute;width:9px;height:9px;background:var(--muted);border-radius:50%;
  top:2px;left:2px;transition:all .15s;}
.sw.on{background:var(--y2);border-color:var(--yellow);}
.sw.on::after{background:var(--yellow);left:13px;}
.fitem{padding:7px 9px;border-radius:5px;background:var(--panel2);border:1px solid var(--border);
  cursor:pointer;transition:all .15s;}
.fitem:hover{border-color:rgba(0,155,155,0.3);background:var(--y3);}
.fi-ch{font-size:7.5px;font-weight:700;letter-spacing:1px;margin-bottom:2px;}
.fi-nm{font-size:11px;font-weight:500;}
.fi-sb{font-size:9px;color:var(--muted);margin-top:1px;}
.icard{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;}
.ic-t{font-size:8.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.icr{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;
  border-bottom:1px solid var(--border);}
.icr:last-child{border-bottom:none;padding-bottom:0;}
.ick{font-size:9.5px;color:var(--muted);}
.icv{font-size:10.5px;font-weight:600;color:var(--text);text-align:right;flex:1;margin-left:6px;}
.icv.hl{color:var(--yellow);}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.spill{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;text-align:center;}
.snum{font-size:17px;font-weight:700;color:var(--yellow);line-height:1;}
.sunit{font-size:8px;color:var(--muted);margin-top:1px;}
.slabel{font-size:8.5px;color:var(--muted);margin-top:2px;font-weight:500;}
.scope-i{display:flex;align-items:flex-start;gap:7px;padding:4px 7px;border-radius:4px;}
.scope-i:hover{background:var(--panel2);}
.sdot{width:17px;height:17px;border-radius:3px;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;}
.stxt{font-size:10.5px;line-height:1.4;}
.ptbl{width:100%;border-collapse:collapse;font-size:9.5px;}
.ptbl th{text-align:left;padding:3px 5px;background:var(--panel3);color:var(--muted);
  font-weight:600;font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border2);}
.ptbl td{padding:3px 5px;border-bottom:1px solid var(--border);color:var(--text);}
.ptbl td:last-child{color:var(--yellow);font-weight:600;text-align:right;}
.ptbl tr:last-child td{border-bottom:none;}
.cgrp{margin-bottom:3px;}
.cghd{font-size:8.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--yellow);padding:4px 7px;background:var(--y3);border-radius:3px;
  margin-bottom:2px;cursor:pointer;display:flex;justify-content:space-between;}
.crow{display:flex;flex-direction:column;padding:4px 7px;border-bottom:1px solid var(--border);}
.crow:last-child{border-bottom:none;}
.cr-n{font-size:9.5px;font-weight:500;}
.cr-t{font-size:8.5px;color:var(--muted);}
.cr-e{font-size:8.5px;color:var(--cyan);margin-top:1px;}
.qpane{padding:10px;display:flex;flex-direction:column;gap:7px;}
.qinfo{font-size:9.5px;color:var(--muted);line-height:1.6;background:var(--panel2);padding:7px 9px;border-radius:5px;border:1px solid var(--border);}
#qrbox{background:#fff;border-radius:5px;padding:8px;display:flex;justify-content:center;min-height:130px;align-items:center;}
.qcoord{font-size:11px;font-weight:600;color:var(--yellow);word-break:break-all;padding:5px 7px;background:var(--panel2);border-radius:4px;border:1px solid var(--border);}
.qbtns{display:flex;gap:4px;}
.qbtn{flex:1;padding:6px;border-radius:5px;font-size:9.5px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;border:none;}
.qbtn.waze{background:#05c8f7;color:#000;}
.qbtn.gmaps{background:#4285f4;color:#fff;}
.qbtn.copy{background:var(--panel2);color:var(--text);border:1px solid var(--border2);}
#pinbtn{background:var(--panel2);border:1px solid rgba(0,155,155,0.3);color:var(--yellow);
  font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;padding:8px;
  border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;}
#pinbtn.active{background:var(--yellow);color:#000;border-color:var(--yellow);}
.cpcard{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;cursor:pointer;transition:all .15s;margin-bottom:4px;}
.cpcard:hover{border-color:rgba(0,155,155,0.3);}
.cphd{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.cpbadge{width:22px;height:22px;border-radius:4px;background:var(--yellow);color:#000;
  font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cpname{font-size:10.5px;font-weight:500;}
.cpcoord{font-size:8.5px;color:var(--muted);}
.cpqr{background:#fff;border-radius:3px;padding:5px;display:flex;justify-content:center;margin-top:5px;}
.cpbtns{display:flex;gap:3px;margin-top:4px;}
.cpbtn{flex:1;padding:4px;border-radius:4px;font-size:8.5px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;border:none;}
.cpbtn.waze{background:#05c8f7;color:#000;}
.cpbtn.gmaps{background:#4285f4;color:#fff;}
/* ── CONTEXT TAB ── */
.ctx-card{background:var(--panel2);border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.ctx-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;
  cursor:pointer;font-size:10px;font-weight:700;color:var(--text);user-select:none;transition:background .15s;}
.ctx-hd:hover{background:var(--panel3);}
.ctx-hd .ctx-arr{font-size:9px;color:var(--muted);transition:transform .2s;}
.ctx-hd.open .ctx-arr{transform:rotate(180deg);}
.ctx-body{display:none;padding:9px 11px;border-top:1px solid var(--border);font-size:9.5px;color:var(--muted);line-height:1.7;}
.ctx-hd.open + .ctx-body{display:block;}
.ctx-body p{margin-bottom:6px;white-space:pre-line;}
/* popup */
.leaflet-popup-content-wrapper{background:var(--panel)!important;border:1px solid var(--border2)!important;
  border-radius:9px!important;box-shadow:0 8px 32px rgba(0,0,0,0.6)!important;
  color:var(--text)!important;font-family:'Inter',sans-serif!important;}
.leaflet-popup-tip{background:var(--panel)!important;}
.leaflet-popup-content{margin:0!important;padding:0!important;}
.pw{padding:11px;min-width:190px;}
.pch{font-size:7.5px;color:var(--yellow);font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.ptl{font-size:11.5px;font-weight:600;margin-bottom:4px;}
.pthumb{width:100%;height:105px;object-fit:cover;border-radius:5px;margin-bottom:6px;cursor:pointer;display:block;}
.ptag{display:inline-block;font-size:7.5px;font-weight:700;padding:2px 5px;border-radius:2px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.popen{display:block;width:100%;padding:5px;text-align:center;background:var(--yellow);color:#000;font-weight:700;font-size:9.5px;border-radius:4px;border:none;cursor:pointer;font-family:'Inter',sans-serif;}
/* legend */
#legend{position:absolute;bottom:14px;right:9px;z-index:800;
  background:rgba(11,21,36,0.93);border:1px solid var(--border2);border-radius:9px;
  padding:9px 11px;min-width:170px;backdrop-filter:blur(4px);}
.lgt{font-size:8.5px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.lgr{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:9.5px;}
.lgr:last-child{margin-bottom:0;}
.lgln{height:3px;border-radius:2px;flex-shrink:0;}
.lgd{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* modal */
#pmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;
  align-items:center;justify-content:center;backdrop-filter:blur(6px);}
#pmodal.show{display:flex;}
.mcard{background:var(--panel);border:1px solid var(--border2);border-radius:12px;overflow:hidden;
  max-width:520px;width:92%;box-shadow:0 24px 80px rgba(0,0,0,0.7);}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
.mch{font-size:8.5px;color:var(--yellow);font-weight:700;letter-spacing:1px;}
.mtl{font-size:13px;font-weight:600;margin-top:2px;}
.mcl{background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;padding:3px;border-radius:3px;transition:color .15s;}
.mcl:hover{color:var(--text);}
.mimg{width:100%;height:260px;object-fit:cover;display:block;}
.mft{padding:10px 16px;display:flex;gap:7px;align-items:center;}
.mnote{font-size:9.5px;color:var(--muted);flex:1;}
.navb{background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-size:12px;
  padding:4px 11px;border-radius:5px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.navb:hover{border-color:var(--yellow);color:var(--yellow);}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--yellow);color:#000;font-weight:700;font-size:10.5px;
  padding:6px 14px;border-radius:18px;z-index:9999;transition:transform .22s;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);}
/* pres mode */
body.pres .m-title{font-size:15px;}
body.pres .m-jkr-txt .t1{font-size:19px;}
body.pres .lname{font-size:13px;}
body.pres .fi-nm{font-size:13px;}
body.pres .icv{font-size:13px;}
body.pres .snum{font-size:22px;}
body.pres #legend{font-size:12px;}
body.pres .lgr{font-size:12px;}
</style>
</head>
<body>
<!-- MASTHEAD -->
<div id="mast">
  <div class="m-jkr">
    <img class="jata" src="" id="client-logo" alt="Client Logo">
    <div class="m-jkr-txt">
      <div class="t1" id="client-name"></div>
      <div class="t2" id="client-subname"></div>
      <div class="t3"><a href="" id="client-url" target="_blank"></a></div>
    </div>
  </div>
  <div class="m-jkr" id="client2-wrap" style="display:none;">
    <img class="jata" src="" id="client2-logo" alt="">
    <div class="m-jkr-txt">
      <div class="t1" id="client2-name"></div>
      <div class="t2" id="client2-subname"></div>
      <div class="t3"><a href="" id="client2-url" target="_blank"></a></div>
    </div>
  </div>
  <div class="m-centre">
    <div class="m-badges" id="badges"></div>
    <div class="m-title" id="project-title"></div>
    <div class="m-sub" id="project-subtitle"></div>
  </div>
  <div class="m-dates" id="date-strip"></div>
  <div class="m-dpi">
    <img src="" id="consultant-logo" alt="Consultant Logo">
    <div class="m-dpi-txt">
      <div class="d2">Disediakan oleh:</div>
      <div class="d1" id="consultant-name"></div>
      <div class="d3" id="consultant-subname"></div>
    </div>
  </div>
</div>
<!-- TOOLBAR -->
<div id="tb">
  <span class="tlbl">Paparan</span>
  <button class="tbb active" onclick="setBase('map',this)">Peta</button>
  <button class="tbb" onclick="setBase('sat',this)">Satelit</button>
  <div class="tsep"></div>
  <button class="tbb" onclick="map.setZoom(map.getZoom()+1)">＋</button>
  <button class="tbb" onclick="map.setZoom(map.getZoom()-1)">－</button>
  <button class="tbb" onclick="flyFull()">Penuh</button>
  <div id="quicknav-btns"></div>
  <div class="tsep"></div>
  <button class="tbb" id="presbtn" onclick="togglePres()">🖥 Mod Projektor</button>
  <button class="tbb" id="sbbtn" onclick="toggleSb()">◀ Panel</button>
  <div id="zdisplay">Z:14</div>
</div>
<!-- BODY -->
<div id="body">
  <div id="sidebar">
    <div class="stabs" id="sidebar-tabs"></div>
    <!-- LAYERS -->
    <div class="tpane active" id="tab-layers"><div class="tb2" id="layers-list"></div></div>
    <!-- FEATURES -->
    <div class="tpane" id="tab-features"><div class="tb2" id="feat-list"></div></div>
    <!-- PROJECT -->
    <div class="tpane" id="tab-project"><div class="tb2" id="project-panel"></div></div>
    <!-- CONTEXT -->
    <div class="tpane" id="tab-context"><div class="tb2" id="context-panel"></div></div>
    <!-- CP/QR -->
    <div class="tpane" id="tab-cp"><div class="qpane" id="cp-panel"></div></div>
    <!-- CONTACTS -->
    <div class="tpane" id="tab-contacts"><div class="tb2" id="contact-list"></div></div>
  </div>
  <div id="map"></div>
</div>
<!-- LEGEND -->
<div id="legend">
  <div class="lgt">Petunjuk</div>
  <div id="legend-content"></div>
</div>
<!-- MODAL -->
<div id="pmodal">
  <div class="mcard">
    <div class="mhd">
      <div><div class="mch" id="mch"></div><div class="mtl" id="mtl"></div></div>
      <button class="mcl" onclick="closeM()">✕</button>
    </div>
    <img class="mimg" id="mimg" src="" alt="">
    <div class="mft">
      <span class="mnote" id="mnote"></span>
      <div id="mnavbtns" style="display:flex;gap:4px;">
        <button class="navb" onclick="mnav(-1)">‹</button>
        <button class="navb" onclick="mnav(1)">›</button>
      </div>
    </div>
  </div>
</div>
<div id="toast">Disalin!</div>
<script>
/* ── Theme injection ── */
(function(){
  const t = APP_CONFIG.theme || {};

/* ── KMZ Helpers ── */
function _hav(lat1, lon1, lat2, lon2) {
  const R=6371000, p1=lat1*Math.PI/180, p2=lat2*Math.PI/180,
        dp=(lat2-lat1)*Math.PI/180, dl=(lon2-lon1)*Math.PI/180,
        a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function _buildCH(poly, interval) {
  if (!poly||poly.length<2) return [];
  const pts=[[0,poly[0][0],poly[0][1]]]; let cum=0, next=interval;
  for (let i=0;i<poly.length-1;i++) {
    const [la1,lo1]=poly[i],[la2,lo2]=poly[i+1], seg=_hav(la1,lo1,la2,lo2);
    while (next<=cum+seg) { const f=(next-cum)/seg; pts.push([next,la1+f*(la2-la1),lo1+f*(lo2-lo1)]); next+=interval; }
    cum+=seg;
  }
  const last=poly[poly.length-1]; pts.push([Math.round(cum),last[0],last[1]]);
  return pts;
}

async function _loadKMZ(url) {
  try {
    const ab = await fetch(url).then(r=>r.arrayBuffer());
    const zip = await JSZip.loadAsync(ab);
    const kmlFile = Object.values(zip.files).find(f=>f.name.toLowerCase().endsWith('.kml'));
    if (!kmlFile) return null;
    let kmlTxt = await kmlFile.async('string');
    kmlTxt = kmlTxt.replace(/<gx:/g,'<').replace(/<\/gx:/g,'</').replace(/<kml:/g,'<').replace(/<\/kml:/g,'</').replace(/<atom:[^>]*>/g,'').replace(/<\/atom:[^>]*>/g,'');
    const doc = new DOMParser().parseFromString(kmlTxt,'application/xml');
    const segs = {};
    doc.querySelectorAll('Placemark').forEach(pm => {
      const name = pm.querySelector('name')?.textContent?.trim();
      const coords = pm.querySelector('LineString coordinates')?.textContent?.trim();
      if (!name||!coords) return;
      segs[name] = coords.trim().split(/\s+/).map(c => { const [lon,lat]=c.split(',').map(Number); return [lat,lon]; });
    });
    return segs;
  } catch(e) { console.warn('KMZ load failed:',e); return null; }
}

/* ── interp: find [lat,lon] at distance d along POLY ── */
function interp(d) {
  let cum=0;
  for (let i=0;i<POLY.length-1;i++) {
    const [la1,lo1]=POLY[i],[la2,lo2]=POLY[i+1],seg=_hav(la1,lo1,la2,lo2);
    if (cum+seg>=d) { const f=(d-cum)/seg; return [la1+f*(la2-la1),lo1+f*(lo2-lo1)]; }
    cum+=seg;
  }
  return POLY[POLY.length-1];
}

      body.innerHTML='<div style="font-size:9.5px;color:var(--muted);text-align:center;padding:12px 0;">Tiada gambar. Tambah URL foto dalam contextCards[].photos.</div>';
    } else {
      body.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">${gphotos.map(p=>`<div style="cursor:pointer;"><img src="${p.src||p}" onclick="openPhoto('${(p.src||p).replace(/'/g,'&#39;')}','${(p.caption||'').replace(/'/g,'&#39;')}')" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;border:1px solid var(--border2);" loading="lazy"><div style="font-size:8.5px;color:var(--muted);margin-top:2px;text-align:center;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.caption||''}</div></div>`).join('')}</div>`;
    }
  }

  wrap.appendChild(hd); wrap.appendChild(body);
  contextPanel.appendChild(wrap);
});

/* ── CP panel ── */
const cpPanel = document.getElementById('cp-panel');
cpPanel.innerHTML = `
  <div class="slbl">Lokasi Lawatan Tapak</div>
  <div class="qinfo">Klik kad CP untuk zoom ke lokasi. Imbas QR → Waze.</div>
  <div id="cp-cards"></div>
  <div style="height:1px;background:var(--border);margin:3px 0;"></div>
  <div class="slbl">Pin Manual</div>
  <button id="pinbtn" onclick="togglePin()"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>Klik peta untuk letak pin</button>
  <div id="pin-wrap" style="display:none;">
    <div class="qcoord" id="qcoord"></div>
    <div id="qrbox"></div>
    <div class="qbtns">
      <button class="qbtn waze" onclick="openWaze()">Waze</button>
      <button class="qbtn gmaps" onclick="openGmaps()">Google Maps</button>
      <button class="qbtn copy" onclick="copyC()">Salin</button>
    </div>
  </div>
`;

/* ── Contacts ── */
const contactList = document.getElementById('contact-list');
APP_CONFIG.contacts.forEach(t => {
  const g=document.createElement('div'); g.className='cgrp';
  const hd=document.createElement('div'); hd.className='cghd'; hd.innerHTML=`${t.label}<span>▾</span>`;
  const bd=document.createElement('div'); bd.style.cssText='background:var(--panel2);border:1px solid var(--border);border-radius:0 0 5px 5px;overflow:hidden;display:none;';
  t.members.forEach(m=>{const r=document.createElement('div');r.className='crow';r.innerHTML=`<span class="cr-n">${m.name}</span><span class="cr-t">${m.title}</span><span class="cr-e">${m.email}</span>`;bd.appendChild(r);});
  let open=false; hd.onclick=()=>{open=!open;bd.style.display=open?'block':'none';hd.querySelector('span').textContent=open?'▴':'▾';};
  g.appendChild(hd);g.appendChild(bd);contactList.appendChild(g);
});

/* ── Feature list ── */
const fl=document.getElementById('feat-list');
const af=[];
JUNC.forEach(([ch,num,name,desc,lon,lat])=>af.push({ch,label:name,sub:'Nod J'+num,color:'#ff4455',lat,lon}));
PROP.forEach(([ch,name,desc,type])=>{const[lat,lon]=interp(ch);af.push({ch,label:pnames[type]||name,sub:'Kaedah Pembinaan Khas',color:'#ff8833',lat,lon});});
SPOS.forEach((pos,i)=>af.push({ch:pos.ch,label:pos.label,sub:pos.note+' · Gambar Tapak',color:'#33ccff',lat:pos.lat,lon:pos.lon,pi:i}));
CPS.forEach(cp=>af.push({ch:0,label:cp.id+': '+cp.name,sub:'Lokasi Lawatan Tapak',color:'var(--yellow)',lat:cp.lat,lon:cp.lon}));
af.sort((a,b)=>a.ch-b.ch);
af.forEach(f=>{
  const cs=f.ch?`CH ${Math.floor(f.ch/1000)}+${String(f.ch%1000).padStart(3,'0')}`:'—';
  const d=document.createElement('div'); d.className='fitem';
  d.innerHTML=`<div class="fi-ch" style="color:${f.color}">${cs}</div><div class="fi-nm">${f.label}</div><div class="fi-sb">${f.sub}</div>`;
  d.onclick=()=>{map.flyTo([f.lat,f.lon],17,{animate:true,duration:1.2});if(f.pi!==undefined)setTimeout(()=>openM(f.pi),700);};
  fl.appendChild(d);
});

/* ── Modal ── */
function openM(idx){curP=idx;const pos=SPOS[idx];const p=PM[pos.img];if(!p)return;document.getElementById('mch').textContent=pos.note;document.getElementById('mtl').textContent=pos.label;document.getElementById('mimg').src=p.src;document.getElementById('mnote').textContent='Lawatan tapak · '+pos.note;document.getElementById('mnavbtns').style.display='flex';document.getElementById('pmodal').classList.add('show');}
function closeM(){document.getElementById('pmodal').classList.remove('show');}
function openPhoto(src,caption){document.getElementById('mch').textContent='KONTEKS PROJEK';document.getElementById('mtl').textContent=caption||'Gambar';document.getElementById('mimg').src=src;document.getElementById('mnote').textContent=caption||'';document.getElementById('mnavbtns').style.display='none';document.getElementById('pmodal').classList.add('show');}
function mnav(d){curP=(curP+d+SPOS.length)%SPOS.length;openM(curP);}
document.getElementById('pmodal').addEventListener('click',e=>{if(e.target===document.getElementById('pmodal'))closeM();});

/* ── Layer toggle ── */
function tgl(n){LGS[n]=!LGS[n];const sw=document.getElementById('sw-'+n);if(LGS[n]){LGM[n].addTo(map);sw.classList.add('on');}else{map.removeLayer(LGM[n]);sw.classList.remove('on');}}

/* ── Base toggle ── */
function setBase(v,el){document.querySelectorAll('.tbb').forEach(b=>{if(b.textContent==='Peta'||b.textContent==='Satelit')b.classList.remove('active');});el.classList.add('active');if(v==='map'){SAT.remove();OSM.addTo(map);}else{OSM.remove();SAT.addTo(map);}}

/* ── Sidebar ── */
let sbO=true;
function toggleSb(){sbO=!sbO;document.getElementById('sidebar').classList.toggle('collapsed',!sbO);document.getElementById('sbbtn').textContent=(sbO?'◀':'▶')+' Panel';}
function switchTab(n){
  const ns=TAB_DEFS.map(t=>t.id);
  document.querySelectorAll('.stab').forEach((t,i)=>t.classList.toggle('active',ns[i]===n));
  document.querySelectorAll('.tpane').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
}

/* ── Fly ── */
function flyFull(){map.flyToBounds(APP_CONFIG.map.bounds,{padding:[40,40],duration:1.5});}

/* ── Pin ── */
let pinM=false,pinC=null,qrI=null;
function togglePin(){pinM=!pinM;const b=document.getElementById('pinbtn');b.classList.toggle('active',pinM);b.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>${pinM?'Aktif — Klik peta':'Klik peta untuk letak pin'}`;map.getContainer().style.cursor=pinM?'crosshair':'';}
map.on('click',e=>{if(!pinM)return;const{lat,lng}=e.latlng;pinC={lat,lng};lgPin.clearLayers();L.marker([lat,lng],{icon:L.divIcon({className:'',html:`<div style="background:var(--yellow);color:#000;font-weight:800;font-size:10px;padding:3px 9px;border-radius:5px;box-shadow:0 4px 16px rgba(0,0,0,0.5);border:2px solid rgba(0,0,0,0.3);white-space:nowrap;">📍 Titik Kumpul</div>`,iconAnchor:[55,16]}),zIndexOffset:1000}).addTo(lgPin);document.getElementById('qcoord').textContent=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;document.getElementById('pin-wrap').style.display='block';const box=document.getElementById('qrbox');box.innerHTML='';qrI=new QRCode(box,{text:`https://waze.com/ul?ll=${lat},${lng}&navigate=yes`,width:130,height:130,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});switchTab('cp');pinM=false;document.getElementById('pinbtn').classList.remove('active');document.getElementById('pinbtn').innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>Klik peta untuk letak pin';map.getContainer().style.cursor='';});
function openWaze(){if(pinC)window.open(`https://waze.com/ul?ll=${pinC.lat},${pinC.lng}&navigate=yes`,'_blank');}
function openGmaps(){if(pinC)window.open(`https://www.google.com/maps?q=${pinC.lat},${pinC.lng}`,'_blank');}
function copyC(){if(!pinC)return;navigator.clipboard.writeText(`${pinC.lat.toFixed(6)},${pinC.lng.toFixed(6)}`);const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

/* ── Pres mode ── */
let presM=false;
function togglePres(){presM=!presM;document.body.classList.toggle('pres',presM);document.getElementById('presbtn').classList.toggle('active',presM);}

/* ── Async init: load KMZ, then render everything ── */
(async function init(){
  if (APP_CONFIG.kmzPath && typeof JSZip!=='undefined') {
    const segs = await _loadKMZ(APP_CONFIG.kmzPath);
    if (segs) {
      const routes = APP_CONFIG.routes||[];
      routes.forEach(r => {
        const pts=[];
        (r.kmzSegments||[]).forEach(sn => { if(segs[sn]) pts.push(...segs[sn]); });
        if (pts.length>=2) r.poly=pts;
      });
      const combined=[];
      routes.forEach(r=>combined.push(...r.poly));
      if (combined.length>=2) {
        POLY=combined;
        CH_PTS=_buildCH(combined, APP_CONFIG.chainageInterval||100);
      }
    }
  }

  renderAlignment();
  renderChainage();
  renderJunctions();
  renderProposed();
  renderSitePhotos();
  renderCPs();

  const cpc=document.getElementById('cp-cards');
  CPS.forEach((cp,i)=>{
    const d=document.createElement('div');d.className='cpcard';
    d.innerHTML=`<div class="cphd"><div class="cpbadge">${cp.id}</div><div><div class="cpname">${cp.name}</div><div class="cpcoord">${cp.lat.toFixed(6)}, ${cp.lon.toFixed(6)}</div></div></div><div class="cpqr" id="cqr-${i}"></div><div class="cpbtns"><button class="cpbtn waze" onclick="event.stopPropagation();window.open('https://waze.com/ul?ll=${cp.lat},${cp.lon}&navigate=yes','_blank')">Waze</button><button class="cpbtn gmaps" onclick="event.stopPropagation();window.open('https://www.google.com/maps?q=${cp.lat},${cp.lon}','_blank')">Google Maps</button></div>`;
    d.onclick=()=>map.flyTo([cp.lat,cp.lon],17,{duration:1.2});
    cpc.appendChild(d);
    setTimeout(()=>new QRCode(document.getElementById(`cqr-${i}`),{text:`https://waze.com/ul?ll=${cp.lat},${cp.lon}&navigate=yes`,width:100,height:100,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M}),200+i*100);
  });

  flyFull();
})();
</script>
</body>
</html>
