<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#060d18">
<title>Route Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#060d18;--panel:#0b1524;--p2:#0f1d30;--p3:#14253e;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);--bd3:rgba(255,255,255,.22);
  --tx:#ddeeff;--mu:#6a88a8;--faint:#1e3a58;
  --teal:#009B9B;--teal2:rgba(0,155,155,.12);--teal3:rgba(0,155,155,.06);--teal4:rgba(0,155,155,.3);
  --am:#FFB800;--rd:#ff4455;--gr:#22c87a;--cy:#33ccff;--mg:#ff33cc;--or:#ff7733;
  --rad:7px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);}
button{cursor:pointer;font-family:'Inter',sans-serif;}
a{color:var(--teal);text-decoration:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--faint);border-radius:2px;}

/* ── HEADER ──────────────────────────────────────── */
#hdr{
  background:var(--panel);border-bottom:2px solid var(--teal4);
  height:62px;display:flex;align-items:stretch;flex-shrink:0;
  position:relative;z-index:300;
}
.hb{display:flex;align-items:center;gap:10px;padding:0 14px;border-right:1px solid var(--bd2);flex-shrink:0;}
.hb img{height:38px;width:auto;object-fit:contain;}
.hb-t .b1{font-size:12px;font-weight:800;color:#fff;letter-spacing:.3px;}
.hb-t .b2{font-size:9px;color:rgba(255,255,255,.45);margin-top:1px;}
.hm{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 14px;min-width:0;}
.hm-title{font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-sub{font-size:9px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hc{display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid var(--bd2);flex-shrink:0;}
.hc img{height:24px;width:auto;}
.hc-t .c1{font-size:9px;font-weight:700;color:#fff;text-align:right;}
.hc-t .c2{font-size:8px;color:var(--mu);text-align:right;}
.ha{display:flex;align-items:center;padding:0 12px;border-left:1px solid var(--bd2);flex-shrink:0;}
.btn-rpt{
  font-size:9.5px;font-weight:700;padding:6px 12px;border-radius:5px;
  background:var(--teal2);color:var(--teal);border:1px solid var(--teal4);
  letter-spacing:.3px;transition:all .15s;white-space:nowrap;text-decoration:none;
}
.btn-rpt:hover{background:var(--teal);color:#000;}

/* ── LAYOUT ──────────────────────────────────────── */
#layout{display:flex;height:calc(100vh - 62px);}

/* ── SIDEBAR ─────────────────────────────────────── */
#sb{
  width:330px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--bd2);display:flex;flex-direction:column;overflow:hidden;
}
#stabs{display:flex;border-bottom:1px solid var(--bd2);flex-shrink:0;}
.stab{
  flex:1;padding:9px 4px;font-size:9px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--mu);border:none;background:transparent;
  border-bottom:2px solid transparent;transition:all .15s;
}
.stab:hover{color:var(--tx);}
.stab.active{color:var(--teal);border-bottom-color:var(--teal);}
#spanel{flex:1;overflow-y:auto;padding:12px 11px;}
.spane{display:none;animation:fin .15s ease;}
.spane.active{display:block;}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Sidebar atoms */
.sh{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--teal);padding-bottom:6px;border-bottom:1px solid var(--bd);margin-bottom:9px;}
.sh+.sh,.card+.sh{margin-top:12px;}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:var(--rad);padding:10px 12px;margin-bottom:7px;}
.krow{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--bd);}
.krow:last-child{border-bottom:none;padding-bottom:0;}
.kk{font-size:9.5px;color:var(--mu);}
.kv{font-size:10px;font-weight:600;color:var(--tx);text-align:right;flex:1;margin-left:8px;}
.kv.hl{color:var(--teal);}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.kpi{background:var(--p2);border:1px solid var(--bd);border-radius:var(--rad);padding:10px;text-align:center;}
.kpi-v{font-size:20px;font-weight:800;color:var(--teal);line-height:1;}
.kpi-l{font-size:8px;color:var(--mu);margin-top:3px;}
.bgp{font-size:10px;line-height:1.65;color:var(--tx);}
.bgp p{margin-top:7px;}
.bgp p:first-child{margin-top:0;}
.al{background:var(--p2);border:1px solid var(--bd);border-left:3px solid var(--am);border-radius:var(--rad);padding:9px 11px;margin-bottom:6px;}
.al.info{border-left-color:var(--teal);}
.al-hd{font-size:9px;font-weight:700;color:var(--am);margin-bottom:3px;}
.al.info .al-hd{color:var(--teal);}
.al-bd{font-size:9.5px;line-height:1.5;color:var(--tx);}
.si{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);}
.si:last-child{border-bottom:none;padding-bottom:0;}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.stxt{font-size:10px;line-height:1.5;color:var(--tx);}
.vtbl{width:100%;border-collapse:collapse;font-size:9px;}
.vtbl th{padding:4px 7px;background:var(--p3);color:var(--mu);text-align:left;font-weight:600;font-size:8px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--bd2);}
.vtbl td{padding:4px 7px;border-bottom:1px solid var(--bd);vertical-align:top;}
.vtbl tr:last-child td{border-bottom:none;}
.vtbl td:first-child{color:var(--teal);font-weight:600;}
.meth{background:var(--p2);border:1px solid var(--bd);border-radius:var(--rad);padding:9px 11px;margin-bottom:5px;cursor:pointer;transition:border-color .15s;}
.meth:hover{border-color:var(--bd2);}
.meth-hd{display:flex;align-items:center;gap:8px;}
.meth-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.meth-lbl{font-size:10px;font-weight:600;color:#fff;}
.meth-ch{font-size:8.5px;color:var(--mu);margin-top:2px;}
.meth-bd{font-size:9.5px;color:var(--mu);line-height:1.55;margin-top:7px;padding-top:7px;border-top:1px solid var(--bd);display:none;}
.meth.open .meth-bd{display:block;}
.cg{margin-bottom:5px;}
.cg-hd{font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);padding:8px 10px;background:var(--teal2);border-radius:var(--rad) var(--rad) 0 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--teal4);}
.cg-body{background:var(--p2);border:1px solid var(--bd);border-top:none;border-radius:0 0 var(--rad) var(--rad);display:none;}
.cg.open .cg-hd{border-radius:var(--rad) var(--rad) 0 0;}
.cg.open .cg-body{display:block;}
.cmem{padding:8px 10px;border-bottom:1px solid var(--bd);}
.cmem:last-child{border-bottom:none;}
.cm-n{font-size:11px;font-weight:500;color:#fff;}
.cm-t{font-size:9px;color:var(--mu);margin-top:1px;}
.route-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);}
.route-chip:last-child{border-bottom:none;}
.rline{width:22px;height:3px;border-radius:2px;flex-shrink:0;}
.rlbl{font-size:10px;color:var(--tx);}

/* ── MAP PANE ─────────────────────────────────────── */
#mapp{flex:1;position:relative;}
#map{position:absolute;inset:0;z-index:0;}

/* Map controls */
.mc{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:4px;}
.mb{
  background:rgba(11,21,36,.92);border:1px solid var(--bd2);color:var(--tx);
  font-size:10.5px;font-weight:600;padding:6px 11px;border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.45);white-space:nowrap;
}
.mb:hover{background:var(--p3);}
.mb.on{background:var(--teal);color:#000;border-color:var(--teal);}
.mb.qn{font-size:9.5px;background:rgba(0,155,155,.1);color:var(--teal);border-color:var(--teal4);}
.mb.qn:hover{background:var(--teal);color:#000;}

/* Legend */
#leg{
  position:absolute;bottom:10px;left:10px;z-index:500;
  background:rgba(11,21,36,.92);border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;
}
.ll{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--tx);margin-bottom:3px;}
.ll:last-child{margin-bottom:0;}
.lline{height:2px;width:18px;border-radius:1px;flex-shrink:0;}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* Leaflet overrides */
.leaflet-popup-content-wrapper{background:var(--panel)!important;border:1px solid var(--bd2)!important;border-radius:9px!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;color:var(--tx)!important;font-family:'Inter',sans-serif!important;}
.leaflet-popup-tip{background:var(--panel)!important;}
.leaflet-popup-content{margin:0!important;padding:0!important;}
.pw{padding:10px;min-width:190px;max-width:260px;}
.pch{font-size:8px;color:var(--teal);font-weight:700;letter-spacing:.8px;margin-bottom:3px;}
.ptl{font-size:12px;font-weight:600;color:#fff;line-height:1.3;}
.pbd{font-size:9.5px;color:var(--mu);margin-top:5px;line-height:1.5;}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div class="hb">
    <img id="d-clogo" src="" alt="">
    <div class="hb-t">
      <div class="b1" id="d-cname"></div>
      <div class="b2" id="d-csub"></div>
    </div>
  </div>
  <div class="hm">
    <div class="hm-title" id="d-title"></div>
    <div class="hm-sub" id="d-sub"></div>
  </div>
  <div class="hc">
    <div class="hc-t">
      <div class="c2">Disediakan oleh:</div>
      <div class="c1" id="d-cons"></div>
    </div>
    <img id="d-cnslogo" src="" alt="">
  </div>
  <div class="ha">
    <a href="tender-report.html" class="btn-rpt">Laporan Penilaian →</a>
  </div>
</div>

<!-- LAYOUT -->
<div id="layout">

  <!-- SIDEBAR -->
  <div id="sb">
    <div id="stabs">
      <button class="stab active" onclick="showTab('projek',this)">Projek</button>
      <button class="stab" onclick="showTab('skop',this)">Skop</button>
      <button class="stab" onclick="showTab('kaedah',this)">Kaedah</button>
      <button class="stab" onclick="showTab('pasukan',this)">Pasukan</button>
    </div>
    <div id="spanel">
      <div class="spane active" id="tab-projek"></div>
      <div class="spane" id="tab-skop"></div>
      <div class="spane" id="tab-kaedah"></div>
      <div class="spane" id="tab-pasukan"></div>
    </div>
  </div>

  <!-- MAP PANE -->
  <div id="mapp">
    <div id="map"></div>
    <div class="mc">
      <button class="mb on" id="btn-osm" onclick="setBase('osm')">Peta</button>
      <button class="mb" id="btn-sat" onclick="setBase('sat')">Satelit</button>
      <button class="mb" onclick="flyFull()">↔ Semua</button>
      <div id="qnav"></div>
    </div>
    <div id="leg">
      <div id="leg-routes"></div>
      <div class="ll"><div class="ldot" style="background:#ff4455;"></div><span>Nod Utama</span></div>
      <div class="ll"><div class="ldot" style="background:#ffcc00;border:1px solid rgba(0,0,0,.2);"></div><span>Tanda Chainage</span></div>
    </div>
  </div>

</div>

<script>
// ── Theme ─────────────────────────────────────────────
(function(){
  const t=APP_CONFIG.theme||{},r=document.documentElement;
  const map={bg:'--bg',panel:'--panel',panel2:'--p2',panel3:'--p3',
    border:'--bd',border2:'--bd2',text:'--tx',muted:'--mu',
    accent:'--teal',accent2:'--teal2',amber:'--am'};
  Object.entries(map).forEach(([k,v])=>{if(t[k])r.style.setProperty(v,t[k]);});
})();

// ── Header ────────────────────────────────────────────
const C=APP_CONFIG;
document.title=C.pageTitle||C.project.title;
document.getElementById('d-clogo').src=C.client.logo||'';
document.getElementById('d-cname').textContent=C.client.name||'';
document.getElementById('d-csub').textContent=C.client.subname||'';
document.getElementById('d-title').textContent=C.project.title||'';
document.getElementById('d-sub').textContent=C.project.subtitle||C.project.tenderNumber||'';
document.getElementById('d-cons').textContent=C.consultant.name||'';
document.getElementById('d-cnslogo').src=C.consultant.logo||'';

// ── Geo data — support both nested (geo.*) and legacy top-level ──
const GEO=C.geo||{};
const POLY=C.POLY||GEO.poly||(C.routes||[]).flatMap(r=>r.poly)||[];
const CH_PTS=C.CH_PTS||GEO.chPts||[];
const JUNC=C.JUNC||GEO.junc||[];
const PROP=C.PROP||GEO.prop||[];

// ── Map init ──────────────────────────────────────────
const mc=C.map||{center:[3.0,101.7],zoom:13};
const map=L.map('map',{center:mc.center,zoom:mc.zoom,zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
const OSM=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19});
const SAT=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19});
OSM.addTo(map);

const lgRoute=L.layerGroup().addTo(map);
const lgCh=L.layerGroup().addTo(map);
const lgJunc=L.layerGroup().addTo(map);
const lgProp=L.layerGroup().addTo(map);

// ── Routes ────────────────────────────────────────────
(C.routes||[]).forEach(r=>{
  L.polyline(r.poly,{color:r.glowColor||r.color,weight:16,opacity:.18,lineJoin:'round'}).addTo(lgRoute);
  L.polyline(r.poly,{color:r.color,weight:4,opacity:.9,lineJoin:'round'}).addTo(lgRoute);
});

// ── Legend routes ─────────────────────────────────────
const legR=document.getElementById('leg-routes');
(C.routes||[]).forEach(r=>{
  const d=document.createElement('div');d.className='ll';
  d.innerHTML=`<div class="lline" style="background:${r.color};"></div><span>${r.label}</span>`;
  legR.appendChild(d);
});

// ── Chainage marks ────────────────────────────────────
CH_PTS.forEach(([ch,lat,lon])=>{
  if(ch===0)return;
  if(ch%500===0){
    const km=Math.floor(ch/1000),m=String(ch%1000).padStart(3,'0');
    const lbl=ch>=1000?`${km}+${m}`:`0+${m}`;
    L.marker([lat,lon],{icon:L.divIcon({className:'',
      html:`<div style="background:#ffcc00;color:#000;font-family:Inter,sans-serif;font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.2);">${lbl}</div>`,
      iconAnchor:[0,8]}),zIndexOffset:50}).addTo(lgCh);
  } else if(ch%100===0){
    L.circleMarker([lat,lon],{radius:2.5,color:'rgba(255,255,255,.6)',fillColor:'rgba(255,255,255,.35)',fillOpacity:1,weight:1}).addTo(lgCh);
  }
});

// ── Interp along POLY (chainage distance → lat/lon) ───
function interp(d){
  if(!POLY.length)return null;
  let cum=0;
  for(let i=0;i<POLY.length-1;i++){
    const[la1,lo1]=POLY[i],[la2,lo2]=POLY[i+1];
    const R=6371000,p1=la1*Math.PI/180,p2=la2*Math.PI/180;
    const dp=(la2-la1)*Math.PI/180,dl=(lo2-lo1)*Math.PI/180;
    const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    const seg=2*R*Math.asin(Math.sqrt(a));
    if(cum+seg>=d){const f=(d-cum)/seg;return[la1+f*(la2-la1),lo1+f*(lo2-lo1)];}
    cum+=seg;
  }
  return POLY[POLY.length-1];
}

// ── Junction markers A/B/C/D ──────────────────────────
// NOTE: JUNC format is [ch, label, name, desc, LON, LAT] — lon/lat reversed vs all other arrays
const jS=JUNC.length?JUNC[0][0]:null,jE=JUNC.length?JUNC[JUNC.length-1][0]:null;
JUNC.forEach(([ch,lbl,name,desc,lon,lat])=>{
  const isS=ch===jS,isE=ch===jE;
  const bg=isS?(C.theme.accent||'#009B9B'):isE?(C.theme.amber||'#FFB800'):'#ff4455';
  const fmt=ch>=1000?`${Math.floor(ch/1000)}+${String(ch%1000).padStart(3,'0')}`:`0+${String(ch).padStart(3,'0')}`;
  const m=L.marker([lat,lon],{icon:L.divIcon({className:'',
    html:`<div style="width:30px;height:30px;border-radius:50%;background:${bg};color:${isS||isE?'#000':'#fff'};display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-size:11px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);">${lbl}</div>`,
    iconSize:[30,30],iconAnchor:[15,15]}),zIndexOffset:100});
  m.bindPopup(`<div class="pw"><div class="pch">CH ${fmt}</div><div class="ptl">${name}</div><div class="pbd">${desc}</div></div>`,{maxWidth:280});
  m.addTo(lgJunc);
});

// ── Proposed structure markers ────────────────────────
const propCol={jacking:'#ff8833',hdd:'#ff33cc',scada:'#33ccff'};
PROP.forEach(([ch,name,desc,type])=>{
  const pos=interp(+ch);
  if(!pos)return;
  const col=propCol[type]||'#aaff00';
  const pm=L.circleMarker(pos,{radius:7,color:col,fillColor:col,fillOpacity:.9,weight:2,zIndexOffset:80});
  pm.bindPopup(`<div class="pw"><div class="pch" style="color:${col};">${(type||'').toUpperCase()}</div><div class="ptl">${name}</div><div class="pbd">${desc}</div></div>`,{maxWidth:260});
  pm.addTo(lgProp);
});

// ── Base layer toggle ─────────────────────────────────
function setBase(b){
  if(b==='osm'){SAT.remove();OSM.addTo(map);}
  else{OSM.remove();SAT.addTo(map);}
  document.getElementById('btn-osm').classList.toggle('on',b==='osm');
  document.getElementById('btn-sat').classList.toggle('on',b==='sat');
}

// ── Fit full extent ───────────────────────────────────
function flyFull(){
  if(mc.bounds)map.flyToBounds(mc.bounds,{padding:[20,20],animate:true,duration:1.2});
  else map.flyTo(mc.center,mc.zoom,{animate:true,duration:1.2});
}

// ── Quick-nav buttons ─────────────────────────────────
const qnEl=document.getElementById('qnav');
(C.quickNav||[]).forEach(q=>{
  const b=document.createElement('button');b.className='mb qn';
  b.textContent=q.label;
  b.onclick=()=>map.flyTo([q.lat,q.lon],q.zoom||17,{animate:true,duration:1.2});
  qnEl.appendChild(b);
});

// ── Sidebar tab switch ────────────────────────────────
function showTab(id,btn){
  document.querySelectorAll('.spane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

// ── Tab: Projek ───────────────────────────────────────
(function(){
  const p=C.project,s=C.stats||{};
  const bgCard=((C.contextCards||[]).find(c=>c.type==='text')||{}).body||'';
  const bgHtml=bgCard
    ? bgCard.split('\n\n').map(par=>`<p>${par.replace(/\n/g,'<br>')}</p>`).join('')
    : '';
  document.getElementById('tab-projek').innerHTML=`
    <div class="sh">Ringkasan Projek</div>
    <div class="kpi2">
      <div class="kpi"><div class="kpi-v">${s.lengthKm||'2.07'}</div><div class="kpi-l">km Jumlah Paip</div></div>
      <div class="kpi"><div class="kpi-v">${s.constructionDurationMonths||p.durationMonths||24}</div><div class="kpi-l">Bulan Pembinaan</div></div>
    </div>
    <div class="card">
      <div class="krow"><div class="kk">No. Tender</div><div class="kv hl">${p.tenderNumber||'—'}</div></div>
      <div class="krow"><div class="kk">Program</div><div class="kv">${p.programme||'—'}</div></div>
      <div class="krow"><div class="kk">Piawai Rekabentuk</div><div class="kv">${p.designStandard||'—'}</div></div>
      <div class="krow"><div class="kk">Status</div><div class="kv">${p.status||'—'}</div></div>
    </div>
    ${bgHtml?`<div class="sh">Latar Belakang</div><div class="card"><div class="bgp">${bgHtml}</div></div>`:''}
    ${(C.alerts||[]).map(a=>`
      <div class="al${a.type==='info'?' info':''}">
        <div class="al-hd">${a.title}</div>
        <div class="al-bd">${a.body}</div>
      </div>`).join('')}
    <div class="sh">Laluan Paip</div>
    <div class="card">
      ${(C.routes||[]).map(r=>`
        <div class="route-chip">
          <div class="rline" style="background:${r.color};"></div>
          <div class="rlbl">${r.label}</div>
        </div>`).join('')}
    </div>
  `;
})();

// ── Tab: Skop ─────────────────────────────────────────
(function(){
  const scope=C.scope||[];
  const ds=C.designStandards||[];
  const permits=((C.contextCards||[]).find(c=>c.columns&&c.columns[0]==='Pihak Berkuasa')||{}).rows||[];
  document.getElementById('tab-skop').innerHTML=`
    <div class="sh">Skop Kerja</div>
    <div class="card">
      ${scope.map(s=>`
        <div class="si">
          <div class="sdot" style="background:${s.color};"></div>
          <div class="stxt">${s.text}</div>
        </div>`).join('')}
    </div>
    ${ds.length?`
      <div class="sh">Piawai Rekabentuk</div>
      <div class="card" style="padding:0;overflow:hidden;">
        <table class="vtbl">
          <thead><tr><th>Parameter</th><th>Nilai</th><th>Unit</th></tr></thead>
          <tbody>
            ${ds.map(d=>`<tr><td>${d.parameter}</td><td>${d.value}</td><td style="color:var(--mu);">${d.unit}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>`:''}
    ${permits.length?`
      <div class="sh">Permit &amp; Kebenaran</div>
      <div class="card" style="padding:0;overflow:hidden;">
        <table class="vtbl">
          <tbody>
            ${permits.map(row=>`<tr><td>${row[0]}</td><td style="color:var(--mu);">${row[1]}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>`:''}
  `;
})();

// ── Tab: Kaedah ───────────────────────────────────────
(function(){
  const methods=C.constructionMethods||[];
  document.getElementById('tab-kaedah').innerHTML=`
    <div class="sh">Kaedah Pembinaan</div>
    ${methods.map(m=>`
      <div class="meth" onclick="this.classList.toggle('open')">
        <div class="meth-hd">
          <div class="meth-dot" style="background:${m.color};"></div>
          <div>
            <div class="meth-lbl">${m.fullLabel||m.shortLabel}</div>
            <div class="meth-ch">${m.chainage||''}</div>
          </div>
        </div>
        <div class="meth-bd">${m.detail||''}</div>
      </div>`).join('')}
  `;
})();

// ── Tab: Pasukan ──────────────────────────────────────
(function(){
  const contacts=C.contacts||[];
  document.getElementById('tab-pasukan').innerHTML=`
    <div class="sh">Pasukan Projek</div>
    ${contacts.map(cg=>`
      <div class="cg" onclick="this.classList.toggle('open')">
        <div class="cg-hd"><span>${cg.label}</span><span>▾</span></div>
        <div class="cg-body">
          ${(cg.members||[]).map(m=>`
            <div class="cmem">
              <div class="cm-n">${m.name}</div>
              <div class="cm-t">${m.title||''}</div>
              ${m.email&&m.email!=='—'?`<div class="cm-t" style="color:var(--cy);">${m.email}</div>`:''}
            </div>`).join('')}
        </div>
      </div>`).join('')}
  `;
})();
</script>
</body>
</html>
