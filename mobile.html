<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Taklimat Projek — Mahkamah Sri Aman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#060d18;--panel:#0b1524;--p2:#0f1d30;--p3:#14253e;
  --bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);
  --tx:#ddeeff;--mu:#6a88a8;--y:#009B9B;--y2:rgba(0,155,155,0.12);
  --cy:#33ccff;--mg:#ff33cc;--or:#ff8833;--rd:#ff4455;--am:#FFB800;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;}
#hdr{background:var(--panel);border-bottom:2px solid rgba(170,255,0,0.2);padding:10px 14px;flex-shrink:0;}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.hdr-jkr{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.hdr-jkr img{width:38px;height:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4));}
.hdr-jkr-t .t1{font-size:13px;font-weight:700;color:#fff;line-height:1.1;}
.hdr-jkr-t .t2{font-size:9px;color:rgba(255,255,255,0.5);}
.hdr-dpi{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.hdr-dpi img{height:24px;width:auto;}
.hdr-dpi-t .d1{font-size:9px;font-weight:700;color:#fff;text-align:right;}
.hdr-dpi-t .d2{font-size:7.5px;color:var(--mu);text-align:right;}
.proj-title{font-size:11px;font-weight:600;color:#fff;line-height:1.4;margin-bottom:5px;}
.date-strip{display:flex;gap:0;background:var(--p2);border-radius:6px;overflow:hidden;}
.ds-item{flex:1;padding:5px 6px;text-align:center;border-right:1px solid var(--bd);}
.ds-item:last-child{border-right:none;}
.ds-l{font-size:7px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);margin-bottom:2px;}
.ds-v{font-size:9px;font-weight:700;color:var(--tx);line-height:1.2;}
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--bd2);display:flex;z-index:1000;padding-bottom:env(safe-area-inset-bottom);}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;transition:all .15s;color:var(--mu);border-top:2px solid transparent;}
.ntab.active{color:var(--y);border-top-color:var(--y);}
.ntab-ic{font-size:18px;line-height:1;margin-bottom:2px;}
.ntab-lb{font-size:8.5px;font-weight:600;}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.screen{display:none;flex:1;overflow-y:auto;flex-direction:column;}
.screen.active{display:flex;}
#map-screen{display:none;flex:1;position:relative;}
#map-screen.active{display:flex;}
#map{position:absolute;inset:0;}
.map-btns{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:5px;}
.mbtn{background:var(--panel);border:1px solid var(--bd2);color:var(--tx);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.4);}
.mbtn.active{background:var(--y);color:#000;border-color:var(--y);}
.pg{padding:12px;display:flex;flex-direction:column;gap:10px;}
::-webkit-scrollbar{display:none;}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:10px;overflow:hidden;}
.card-hd{padding:10px 12px;border-bottom:1px solid var(--bd);}
.card-hd-t{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);}
.card-body{padding:10px 12px;}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bd);}
.row:last-child{border-bottom:none;padding-bottom:0;}
.rk{font-size:11px;color:var(--mu);}
.rv{font-size:12px;font-weight:600;color:var(--tx);text-align:right;flex:1;margin-left:8px;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.spill{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center;}
.snum{font-size:22px;font-weight:700;color:var(--y);line-height:1;}
.sunit{font-size:9px;color:var(--mu);margin-top:2px;}
.slbl{font-size:10px;color:var(--mu);margin-top:4px;font-weight:500;}
.bh-card{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;}
.bh-id{font-size:13px;font-weight:800;color:var(--y);margin-bottom:4px;}
.bh-meta{font-size:9px;color:var(--mu);margin-bottom:6px;}
.bh-layer{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:10px;}
.bh-bar{flex:1;height:14px;border-radius:3px;position:relative;overflow:hidden;}
.scope-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);}
.scope-item:last-child{border-bottom:none;}
.scope-dot{width:20px;height:20px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.scope-txt{font-size:11px;line-height:1.45;}
.alert-box{background:rgba(255,170,0,0.06);border:1px solid rgba(255,170,0,0.25);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.alert-title{font-size:10px;font-weight:700;color:var(--am);margin-bottom:3px;}
.alert-body{font-size:11px;color:var(--mu);line-height:1.5;}
.cg-hd{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--y);padding:10px 12px;background:var(--y2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.cg-body{display:none;padding:8px 12px;}
.cmem{padding:8px 0;border-bottom:1px solid var(--bd);}
.cmem:last-child{border-bottom:none;}
.cm-n{font-size:12px;font-weight:500;}
.cm-t{font-size:10px;color:var(--mu);margin-top:1px;}
.cm-e{font-size:10px;color:var(--cy);margin-top:2px;}
.leaflet-popup-content-wrapper{background:var(--panel)!important;border:1px solid var(--bd2)!important;border-radius:9px!important;box-shadow:0 8px 32px rgba(0,0,0,0.6)!important;color:var(--tx)!important;font-family:'Inter',sans-serif!important;}
.leaflet-popup-tip{background:var(--panel)!important;}
</style>
</head>
<body style="display:flex;flex-direction:column;">

<div id="hdr">
  <div class="hdr-top">
    <div class="hdr-jkr">
      <img id="m-client-logo" src="" alt="" style="width:38px;height:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4));">
      <div class="hdr-jkr-t">
        <div class="t1" id="m-client-name"></div>
        <div class="t2" id="m-client-subname"></div>
      </div>
    </div>
    <div class="hdr-dpi">
      <div class="hdr-dpi-t"><div class="d2">Disediakan oleh:</div><div class="d1" id="m-consultant-name"></div></div>
      <img id="m-consultant-logo" src="" alt="Consultant Logo" style="height:24px;width:auto;">
    </div>
  </div>
  <div class="proj-title" id="m-project-title"></div>
  <div class="date-strip" id="m-date-strip"></div>
</div>

<div id="content">
  <div class="screen active" id="map-screen">
    <div id="map"></div>
    <div class="map-btns">
      <button class="mbtn active" id="base-osm" onclick="setBase('osm')">Peta</button>
      <button class="mbtn" id="base-sat" onclick="setBase('sat')">Satelit</button>
      <button class="mbtn" onclick="flyFull()">↔ Keseluruhan</button>
    </div>
  </div>

  <div class="screen" id="info-screen">
    <div class="pg" id="m-info-panel"></div>
  </div>

  <div class="screen" id="geo-screen">
    <div class="pg" id="m-geo-panel"></div>
  </div>

  <div class="screen" id="team-screen">
    <div class="pg" id="m-team-panel"></div>
  </div>
</div>

<div id="nav">
  <div class="ntab active" onclick="showScreen('map-screen',this)"><div class="ntab-ic">🗺</div><div class="ntab-lb">Peta</div></div>
  <div class="ntab" onclick="showScreen('info-screen',this)"><div class="ntab-ic">📋</div><div class="ntab-lb">Info</div></div>
  <div class="ntab" onclick="showScreen('geo-screen',this)"><div class="ntab-ic">🏗</div><div class="ntab-lb">Geoteknik</div></div>
  <div class="ntab" onclick="showScreen('team-screen',this)"><div class="ntab-ic">👥</div><div class="ntab-lb">Pasukan</div></div>
</div>

<script>
const C=APP_CONFIG, T=C.theme||{}, GT=C.geotechnical||{};
const {geo}=C;

/* Header */
document.getElementById('m-client-logo').src=C.client.logo;
document.getElementById('m-client-name').textContent=C.client.name;
document.getElementById('m-client-subname').textContent=C.client.subname;
document.getElementById('m-consultant-logo').src=C.consultant.logo;
document.getElementById('m-consultant-name').textContent=C.consultant.name;
document.getElementById('m-project-title').textContent=C.project.title;

/* Date strip */
const strip=document.getElementById('m-date-strip');
[['Tender',C.project.tenderNumber],['Briefing',C.dates.briefing],['Standard',C.project.designStandard.split('·')[0].trim()]].forEach(([l,v])=>{
  const d=document.createElement('div');d.className='ds-item';
  d.innerHTML=`<div class="ds-l">${l}</div><div class="ds-v">${v}</div>`;
  strip.appendChild(d);
});

/* Map */
const map=L.map('map',{center:C.map.center,zoom:C.map.zoom,zoomControl:false});
L.control.zoom({position:'bottomleft'}).addTo(map);
const OSM=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19});
const SAT=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19});
OSM.addTo(map);

const lg=L.layerGroup().addTo(map);

/* Boundary */
if(geo.poly&&geo.poly.length>2){
  L.polygon(geo.poly,{color:'#aaff00',weight:2,fillColor:'#aaff00',fillOpacity:0.05,dashArray:'4 4'}).addTo(lg);
}

/* Boreholes */
const bhClr={'BH1':'#F44336','BH2':'#E91E63','BH3':'#9C27B0','BH4':'#673AB7','BH5':'#3F51B5','BH6':'#009688','BH7':'#FF5722'};
(GT.boreholes||[]).forEach(bh=>{
  const clr=bhClr[bh.id]||'#0099D4';
  L.marker([bh.lat,bh.lon],{icon:L.divIcon({className:'',html:`<div style="width:26px;height:26px;border-radius:50%;background:${clr};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);">${bh.id}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(lg)
    .bindPopup(`<div style="padding:10px;min-width:180px;"><div style="font-size:9px;color:var(--y);font-weight:700;margin-bottom:2px;">${bh.id}</div><div style="font-size:12px;font-weight:700;">RL ${bh.rlM} · ${bh.depthM}m</div><div style="font-size:10px;color:var(--mu);margin-top:3px;">${bh.layers.map(l=>l.soil+' ('+l.depthFrom+'-'+l.depthTo+'m)').join('<br>')}</div></div>`);
});

/* Facilities */
(C.facilities||[]).forEach(f=>{
  const c=f.tag==='primary'?'#0099D4':'#FFB800';
  L.marker([f.lat,f.lon],{icon:L.divIcon({className:'',html:`<div style="width:28px;height:28px;border-radius:6px;background:${c};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);">${f.marker}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}).addTo(lg)
    .bindPopup(`<div style="padding:10px;"><div style="font-size:12px;font-weight:700;">${f.name}</div><div style="font-size:10px;color:var(--mu);margin-top:2px;">${f.detail}</div></div>`);
});

function setBase(v){
  document.getElementById('base-osm').classList.toggle('active',v==='osm');
  document.getElementById('base-sat').classList.toggle('active',v==='sat');
  if(v==='osm'){SAT.remove();OSM.addTo(map);}else{OSM.remove();SAT.addTo(map);}
}
function flyFull(){map.flyToBounds(C.map.bounds,{padding:[40,40],duration:1.5});}
function showScreen(id,el){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.ntab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(id==='map-screen')setTimeout(()=>map.invalidateSize(),50);
}

/* Info panel */
const ip=document.getElementById('m-info-panel');
ip.innerHTML=`<div class="sgrid">
  <div class="spill"><div class="snum">7</div><div class="sunit">BH</div><div class="slbl">Lubang Gerudi</div></div>
  <div class="spill"><div class="snum">32</div><div class="sunit">Probe</div><div class="slbl">Mackintosh</div></div>
  <div class="spill"><div class="snum">${GT.settlement.totalSettlementMm}</div><div class="sunit">mm</div><div class="slbl">Enapan</div></div>
  <div class="spill"><div class="snum">1.639</div><div class="sunit">FOS</div><div class="slbl">Kestabilan</div></div>
</div>`;

if(C.alerts&&C.alerts.length){
  C.alerts.forEach(a=>{
    ip.insertAdjacentHTML('beforeend',`<div class="alert-box"><div class="alert-title">${a.title}</div><div class="alert-body">${a.body}</div></div>`);
  });
}

let scopeH=`<div class="card"><div class="card-hd"><div class="card-hd-t">Skop Kerja</div></div><div class="card-body">`;
(C.scope||[]).forEach((s,i)=>{
  scopeH+=`<div class="scope-item"><div class="scope-dot" style="background:${s.color}1a;color:${s.color};border:1px solid ${s.color}40;">${i+1}</div><div class="scope-txt">${s.text}</div></div>`;
});
scopeH+=`</div></div>`;
ip.insertAdjacentHTML('beforeend',scopeH);

/* Geotechnical panel */
const gp=document.getElementById('m-geo-panel');
(GT.boreholes||[]).forEach(bh=>{
  let layersHtml='';
  bh.layers.forEach(L=>{
    layersHtml+=`<div class="bh-layer"><div class="bh-bar" style="background:${L.colour};height:14px;border-radius:3px;"></div><div style="font-size:10px;color:var(--mu);white-space:nowrap;">${L.soil} ${L.depthFrom}-${L.depthTo}m (SPT ${L.spt})</div></div>`;
  });
  gp.insertAdjacentHTML('beforeend',`<div class="bh-card"><div class="bh-id">${bh.id}</div><div class="bh-meta">RL ${bh.rlM} · ${bh.depthM}m · GWL ${bh.gwlM}m</div>${layersHtml}</div>`);
});

gp.insertAdjacentHTML('beforeend',`<div class="card"><div class="card-hd"><div class="card-hd-t">Kestabilan & Kimia</div></div><div class="card-body">
  <div class="row"><span class="rk">FOS Statik</span><span class="rv" style="color:#4CAF50;">${GT.slopeStability.staticFos}</span></div>
  <div class="row"><span class="rk">FOS Seismik</span><span class="rv" style="color:#4CAF50;">${GT.slopeStability.seismicFos}</span></div>
  <div class="row"><span class="rk">Sulfat</span><span class="rv">${GT.chemical.sulphate.range}</span></div>
  <div class="row"><span class="rk">pH</span><span class="rv">${GT.chemical.ph.range}</span></div>
</div></div>`);

/* Team panel */
const tp=document.getElementById('m-team-panel');
(C.projectTeam||[]).forEach(t=>{
  tp.insertAdjacentHTML('beforeend',`<div class="card" style="margin-bottom:8px;"><div class="card-body">
    <div style="font-size:9px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;">${t.role}</div>
    <div style="font-size:13px;font-weight:700;">${t.name}</div>
    <div style="font-size:10px;color:var(--mu);margin-top:2px;line-height:1.5;">${t.detail}</div>
  </div></div>`);
});

if(C.contacts&&C.contacts.length){
  tp.insertAdjacentHTML('beforeend',`<div style="font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;padding:4px 0;">Hubungi</div>`);
  C.contacts.forEach(g=>{
    const hd=document.createElement('div');hd.className='cg-hd';hd.innerHTML=`${g.label}<span>▾</span>`;
    const bd=document.createElement('div');bd.className='cg-body';
    g.members.forEach(m=>{
      bd.insertAdjacentHTML('beforeend',`<div class="cmem"><div class="cm-n">${m.name}</div><div class="cm-t">${m.title}</div><div class="cm-e">${m.email}</div></div>`);
    });
    let open=false;hd.onclick=()=>{open=!open;bd.style.display=open?'block':'none';hd.querySelector('span').textContent=open?'▴':'▾';};
    tp.appendChild(hd);tp.appendChild(bd);
  });
}
</script>
</body>
</html>
